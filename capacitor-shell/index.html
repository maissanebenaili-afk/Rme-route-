<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MRE Route</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 28rem;
        margin: 2rem;
        padding: 1.5rem;
        border: 1px solid #cbd5e1;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
        color: #065f46;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MRE Route</h1>
      <p>
        Cette coque Android doit être reliée à une URL HTTPS de production via
        <code>CAPACITOR_SERVER_URL</code> avant publication.
      </p>
      <p>
        Le projet utilise des routes API Next.js côté serveur et ne doit pas être publié comme une
        exportation statique incomplète.
      </p>
    </main>
  </body>
</html>
